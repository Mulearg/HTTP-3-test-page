<style>
 *{margin:0;box-sizing:border-box}
 body{width:1200px;height:630px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;

 .mark{width:56px;height:56px}
 .eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid #E1E6F4;
          border-radius:100px;font-size:15px;font-weight:700;letter-spacing:.08em;color:#016F74;align-self:flex-start}
 .dot{width:9px;height:9px;border-radius:50%;background:#04B81E}
 h1{font-size:76px;line-height:88px;letter-spacing:-.6px;font-weight:700;color:#050038;max-width:1000px}
 .foot{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:500;color:#050038}
 .sep{width:1px;height:22px;background:#E1E6F4}

<!--
  Source for the Open Graph share image (1200x630).

  Not part of the build — it lives here so the card is reproducible rather than
  a mystery PNG. It uses the real brand mark lifted from logo-black.svg, the
  hero wash, and the type ramp from tokens.css.

  To produce public/og.png:
    npx playwright screenshot --viewport-size=1200,630 \
      tools/og-card.html public/og.png

  Then add to index.html:
    <meta property="og:image" content="https://<domain>/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  and change twitter:card from "summary" to "summary_large_image".
-->
